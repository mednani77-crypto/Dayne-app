name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deynbook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: deynbook-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
